const aliases=new Map([['巴黎','卢浮宫'],['尼斯','尼斯老城'],['芒通','圣米歇尔大教堂 Menton'],['menton','圣米歇尔大教堂 Menton'],['摩纳哥','蒙特卡洛大赌场'],['monaco','蒙特卡洛大赌场'],['戛纳','影节宫'],['cannes','影节宫'],['昂蒂布','毕加索博物馆 Antibes'],['antibes','毕加索博物馆 Antibes'],['埃兹','Èze Village'],['eze','Èze Village'],['èze','Èze Village'],['铁塔','埃菲尔铁塔'],['埃菲尔','埃菲尔铁塔'],['歌剧院','巴黎歌剧院'],['cdg','戴高乐机场 CDG'],['nce','尼斯机场 NCE'],['ory','奥利机场 ORY']]);
const colors=['#0f766e','#c75d47','#1d5f85','#a87817','#697e33','#76518b','#157a9c','#8f4c38'];
const all=days.flatMap((d,di)=>d.places.map((p,pi)=>({name:p[0],lat:p[1],lng:p[2],kind:p[3],dayIndex:di,placeIndex:pi,date:d.date,title:d.title,region:d.region})));const byName=new Map(all.map(p=>[p.name.toLowerCase(),p]));const enc=encodeURIComponent;const maps=p=>`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=walking`;const xhs=q=>`https://www.xiaohongshu.com/search_result?keyword=${enc(q)}`;const dp=q=>`https://www.dianping.com/search/keyword/1/0_${enc(q)}`;
const map=L.map('map',{zoomControl:false}).setView([46.1,4.45],6);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const markers=new Map(),routes=[];let active='all',searchMarker=null;const list=document.querySelector('#itineraryList'),status=document.querySelector('#statusCard'),mapTitle=document.querySelector('#mapTitle'),input=document.querySelector('#destinationInput');
function icon(di,on=false){const c=on?'#111827':colors[di%colors.length];return L.divIcon({className:'trip-marker',html:`<span style="display:grid;place-items:center;width:${on?32:26}px;height:${on?32:26}px;border:3px solid #fff;border-radius:50%;background:${c};color:#fff;font-weight:900;box-shadow:0 8px 18px rgba(0,0,0,.25)">${di+1}</span>`,iconSize:[36,36],iconAnchor:[18,18],popupAnchor:[0,-14]})}
function popup(p){return `<span class="popupTitle">${p.name}</span><span class="popupMeta">${p.date} · ${p.region} · ${p.kind}</span><div class="links"><a target="_blank" href="${maps(p)}">Google导航</a><a target="_blank" href="${xhs(p.name)}">小红书</a></div>`}
function draw(day='all'){markers.forEach(m=>m.remove());markers.clear();routes.forEach(r=>r.remove());routes.length=0;(day==='all'?days:[days[+day]]).forEach((d,li)=>{const di=day==='all'?li:+day;routes.push(L.polyline(d.places.map(p=>[p[1],p[2]]),{color:colors[di%colors.length],weight:day==='all'?3:5,opacity:day==='all'?.5:.85}).addTo(map));d.places.forEach((p,pi)=>{const pl={name:p[0],lat:p[1],lng:p[2],kind:p[3],dayIndex:di,placeIndex:pi,date:d.date,title:d.title,region:d.region};const m=L.marker([pl.lat,pl.lng],{icon:icon(di)}).bindPopup(popup(pl)).addTo(map);m.on('click',()=>activate(pl));markers.set(`${di}-${pi}-${pl.name}`,m)})})}
function render(day='all'){list.innerHTML=(day==='all'?days:[days[+day]]).map((d,li)=>{const di=day==='all'?li:+day;return `<article class="dayCard"><header class="dayHead"><div><h3>${d.title}</h3><p>${d.summary}</p></div><time>${d.date}</time></header><div class="tags" style="padding:10px 12px 0"><span class="tag">${d.region}</span>${d.weather.map(w=>`<span class="weather">${w}</span>`).join('')}<span class="tag cut">${d.cut}</span></div><ul class="places">${d.places.map((p,pi)=>{const pl={name:p[0],lat:p[1],lng:p[2]};return `<li><button class="placeBtn" data-day="${di}" data-place="${pi}"><span class="num">${pi+1}</span><span><strong>${p[0]}</strong><span class="links"><a target="_blank" href="${maps(pl)}">Google导航</a><a target="_blank" href="${xhs(p[0])}">小红书</a></span></span><span class="kind">${p[3]}</span></button></li>`}).join('')}</ul>${d.food.length?`<section class="foodCard" style="margin:0 12px 12px;padding:11px"><h3>当天餐厅候选</h3>${d.food.map(r=>`<p><strong>${r[0]}</strong> · ${r[1]}</p><div class="tags">${r[2].map(p=>`<span class="pay">${p}</span>`).join('')}<a class="tag" target="_blank" href="${xhs(r[0]+' 法国 近期体验')}">小红书近期</a><a class="tag" target="_blank" href="${dp(r[0])}">大众点评</a></div>`).join('')}</section>`:''}</article>`}).join('')}
function fit(){const v=active==='all'?all:all.filter(p=>p.dayIndex===+active);map.fitBounds(L.latLngBounds(v.map(p=>[p.lat,p.lng])).pad(.18))}
function activate(p){document.querySelectorAll('.placeBtn').forEach(b=>b.classList.toggle('active',+b.dataset.day===p.dayIndex&&+b.dataset.place===p.placeIndex));const m=markers.get(`${p.dayIndex}-${p.placeIndex}-${p.name}`);if(m){m.setIcon(icon(p.dayIndex,true));m.openPopup()}map.flyTo([p.lat,p.lng],p.kind==='机场'?12:15,{duration:.8});mapTitle.textContent=p.name;status.textContent=`${p.date} · ${p.region} · ${p.kind}`}
function find(q){const k=q.trim().toLowerCase();if(!k)return null;const a=aliases.get(k);if(a)return byName.get(a.toLowerCase());if(byName.has(k))return byName.get(k);return all.find(p=>p.name.toLowerCase().includes(k)||k.includes(p.name.toLowerCase()))}
async function show(q){const local=find(q);if(local)return activate(local);status.textContent='正在在线查找目的地...';try{const u=new URL('https://nominatim.openstreetmap.org/search');u.searchParams.set('format','jsonv2');u.searchParams.set('limit','1');u.searchParams.set('q',`${q}, France`);const r=(await (await fetch(u)).json())[0];if(!r)return status.textContent=`没有找到“${q}”`;const lat=+r.lat,lng=+r.lon;if(searchMarker)searchMarker.remove();searchMarker=L.marker([lat,lng]).bindPopup(`<span class="popupTitle">${r.display_name}</span>`).addTo(map).openPopup();map.flyTo([lat,lng],14);mapTitle.textContent=q;status.textContent=`已显示：${r.display_name}`}catch{status.textContent='在线搜索暂时不可用，请换一个目的地名称'}}
const filters=document.querySelector('#filters');['全部','6/6','6/7','6/8','6/9','6/10','6/11','6/12','6/13'].forEach((t,i)=>{const b=document.createElement('button');b.className='filter'+(i?'':' active');b.dataset.day=i?String(i-1):'all';b.textContent=t;filters.append(b)});document.querySelector('#destinationOptions').innerHTML=all.map(p=>`<option value="${p.name}"></option>`).join('');['埃菲尔铁塔','尼斯老城','Èze Village','蒙特卡洛大赌场','影节宫','Baronne Paris'].forEach(n=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.onclick=()=>{input.value=n;show(n)};document.querySelector('#quickDestinations').append(b)});document.querySelector('#showDestination').onclick=()=>show(input.value);input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();show(input.value)}};document.querySelector('#fitRoute').onclick=()=>{mapTitle.textContent=active==='all'?'全程路线':days[+active].title;fit();status.textContent=active==='all'?'已加载完整行程路线':days[+active].summary};document.querySelector('#locateParis').onclick=()=>show('巴黎');document.querySelector('#locateNice').onclick=()=>show('尼斯');document.querySelector('#toggleNotes').onclick=()=>document.querySelector('#strategyDrawer').hidden=!document.querySelector('#strategyDrawer').hidden;filters.onclick=e=>{const b=e.target.closest('.filter');if(!b)return;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.day;draw(active);render(active);mapTitle.textContent=active==='all'?'全程路线':days[+active].title;status.textContent=active==='all'?'已加载完整行程路线':days[+active].summary;fit()};list.onclick=e=>{if(e.target.closest('a'))return;const b=e.target.closest('.placeBtn');if(!b)return;const d=days[+b.dataset.day],p=d.places[+b.dataset.place];activate({name:p[0],lat:p[1],lng:p[2],kind:p[3],dayIndex:+b.dataset.day,placeIndex:+b.dataset.place,date:d.date,title:d.title,region:d.region})};draw();render();fit();
</script>
